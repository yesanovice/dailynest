<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Nest - Habit Tracker</title>
    <meta name="description" content="Track your habits and build streaks with Daily Nest">
    <meta name="theme-color" content="#6366f1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-lightest: #e0e7ff;
            --primary-dark: #4f46e5;
            --primary-darker: #4338ca;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --success: #10b981;
            --success-light: #a7f3d0;
            --success-dark: #059669;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --warning-dark: #d97706;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --danger-dark: #dc2626;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --info-dark: #2563eb;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --rose: #f43f5e;
            --indigo: #6366f1;
            --teal: #14b8a6;
            --emerald: #10b981;
            --sky: #0ea5e9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --ring-shadow: 0 0 0 3px rgba(99, 102, 241, 0.5);
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
            --gradient-warning: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
            --gradient-danger: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: var(--gray-900);
        }

        header {
            background: var(--gradient-primary);
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
            animation: headerSlideDown 0.5s ease-out;
        }

        @keyframes headerSlideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .header-subtitle {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            padding: 0.25rem;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(4px);
        }

        .tab {
            padding: 0.5rem 1.25rem;
            cursor: pointer;
            border-radius: 9999px;
            transition: all 0.3s ease;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
        }

        .tab.active {
            background-color: white;
            color: var(--primary-dark);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .tab:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .tab-content {
            display: none;
            padding: 1.5rem 0;
            animation: fadeIn 0.4s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0;
                transform: translateY(10px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .habits-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease-out 0.2s both;
        }

        .habits-header h2 {
            font-size: 1.75rem;
            color: var(--gray-900);
        }

        .habit-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .habit-card {
            background-color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--gray-100);
            animation: cardEnter 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .habit-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .habit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            transition: all 0.3s ease;
        }

        .habit-card:hover::before {
            width: 6px;
        }

        .habit-name {
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .habit-name-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-lightest);
            color: var(--primary-dark);
            flex-shrink: 0;
        }

        .habit-streak {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            gap: 0.5rem;
        }

        .streak-count {
            background: var(--gradient-warning);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.85rem;
            box-shadow: var(--shadow-sm);
        }

        .streak-count .icon {
            font-size: 1rem;
        }

        .habit-progress {
            margin: 1.5rem 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .progress-bar {
            height: 8px;
            background-color: var(--gray-100);
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-success);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 9999px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .habit-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        .btn:focus {
            outline: none;
            box-shadow: var(--ring-shadow);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
        }

        .btn-success:hover {
            background: var(--success-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-danger {
            background: var(--gradient-danger);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-edit {
            background-color: var(--warning);
            color: white;
        }

        .btn-edit:hover {
            background-color: var(--warning-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background-color: white;
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background-color: var(--gray-50);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-icon {
            padding: 0.5rem;
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 500px;
            animation: modalSlideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: var(--shadow-2xl);
            border: 1px solid var(--gray-100);
        }

        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-500);
            transition: color 0.2s ease;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-btn:hover {
            background-color: var(--gray-100);
            color: var(--gray-700);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--gray-700);
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--ring-shadow);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .calendar-container {
            background-color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
            animation: fadeIn 0.5s ease-out;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .month-year {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--gray-900);
            font-family: 'Playfair Display', serif;
        }

        .calendar {
            width: 100%;
            border-collapse: collapse;
        }

        .calendar th {
            background-color: var(--gray-50);
            color: var(--gray-600);
            padding: 0.75rem;
            text-align: center;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid var(--gray-100);
        }

        .calendar td {
            border: 1px solid var(--gray-100);
            padding: 0.75rem;
            height: 100px;
            vertical-align: top;
            position: relative;
            transition: all 0.2s ease;
        }

        .calendar td:hover {
            background-color: var(--gray-50);
        }

        .calendar-day {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--gray-700);
            font-size: 0.9rem;
        }

        .day-outside-month {
            background-color: var(--gray-50);
            color: var(--gray-400);
        }

        .today .calendar-day {
            background-color: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .habit-indicators {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .habit-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .habit-indicator:hover {
            transform: scale(1.2);
        }

        .completed {
            background-color: var(--success);
        }

        .missed {
            background-color: var(--danger);
        }

        .partial {
            background-color: var(--warning);
        }

        .streak-day {
            box-shadow: 0 0 0 2px var(--warning);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--gray-500);
            animation: fadeIn 0.6s ease-out;
        }

        .empty-state-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }

        .empty-state-text {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--gray-600);
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .stats-container {
            background-color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
            animation: fadeIn 0.5s ease-out;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .stat-card {
            background-color: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card h3 {
            margin-bottom: 1rem;
            color: var(--gray-800);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-family: 'Playfair Display', serif;
        }

        .stat-detail {
            color: var(--gray-600);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .stat-row-label {
            color: var(--gray-600);
        }

        .stat-row-value {
            font-weight: 500;
            color: var(--gray-800);
        }

        .habit-color-preview {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 0.5rem;
            border: 2px solid var(--gray-200);
        }

        /* Install button styles */
        .install-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-xl);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .install-btn:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: var(--shadow-2xl);
            animation: none;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .habit-list {
                grid-template-columns: 1fr;
            }
            
            .calendar td {
                height: 80px;
                padding: 0.5rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .calendar td {
                height: 60px;
                font-size: 0.8rem;
            }
            
            .calendar-day {
                font-size: 0.8rem;
            }
            
            .habit-indicator {
                width: 8px;
                height: 8px;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Tooltip styles */
        [data-tooltip] {
            position: relative;
            cursor: pointer;
        }

        [data-tooltip]:hover::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--gray-800);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            margin-bottom: 0.5rem;
            box-shadow: var(--shadow-md);
        }

        [data-tooltip]:hover::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: var(--gray-800) transparent transparent transparent;
            margin-bottom: -0.5rem;
            pointer-events: none;
        }

        /* Confetti effect */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: var(--primary);
            opacity: 0;
            z-index: 9999;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Daily Nest</h1>
            <p class="header-subtitle">Build habits, track progress, achieve goals</p>
            <div class="nav-tabs">
                <div class="tab active" data-tab="habits">Habits</div>
                <div class="tab" data-tab="calendar">Calendar</div>
                <div class="tab" data-tab="stats">Stats</div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Habits Tab -->
        <div class="tab-content active" id="habits">
            <div class="habits-header">
                <h2>Your Habits</h2>
                <button class="btn btn-primary" id="add-habit-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Habit
                </button>
            </div>
            <div class="habit-list" id="habit-list">
                <!-- Habit cards will be added here dynamically -->
            </div>
        </div>

        <!-- Calendar Tab -->
        <div class="tab-content" id="calendar">
            <div class="calendar-container">
                <div class="calendar-nav">
                    <button class="btn btn-secondary" id="prev-month">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="month-year" id="month-year">Month Year</div>
                    <button class="btn btn-secondary" id="next-month">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <table class="calendar" id="calendar-table">
                    <thead>
                        <tr>
                            <th>Sun</th>
                            <th>Mon</th>
                            <th>Tue</th>
                            <th>Wed</th>
                            <th>Thu</th>
                            <th>Fri</th>
                            <th>Sat</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body">
                        <!-- Calendar will be generated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Stats Tab -->
        <div class="tab-content" id="stats">
            <div class="stats-container">
                <h2>Your Progress</h2>
                <div id="stats-content">
                    <!-- Stats will be added here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Habit Modal -->
    <div class="modal" id="habit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Add New Habit</div>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="habit-form">
                <input type="hidden" id="habit-id">
                <div class="form-group">
                    <label for="habit-name">Habit Name</label>
                    <input type="text" id="habit-name" required placeholder="e.g. Drink 8 glasses of water">
                </div>
                <div class="form-group">
                    <label for="habit-target">Target (per day)</label>
                    <input type="number" id="habit-target" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label for="habit-start-date">Start Date</label>
                    <input type="date" id="habit-start-date" required>
                </div>
                <div class="form-group">
                    <label for="habit-color">Color</label>
                    <select id="habit-color">
                        <option value="#6366f1">Indigo</option>
                        <option value="#10b981">Emerald</option>
                        <option value="#3b82f6">Blue</option>
                        <option value="#ef4444">Red</option>
                        <option value="#f59e0b">Amber</option>
                        <option value="#8b5cf6">Purple</option>
                        <option value="#ec4899">Pink</option>
                        <option value="#14b8a6">Teal</option>
                    </select>
                    <span class="habit-color-preview" id="color-preview" style="background-color: #6366f1;"></span>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-habit">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Habit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Install Button -->
    <button class="install-btn" id="install-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
    </button>

    <script>
        // App Data
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        let currentDate = new Date();
        let currentViewMonth = currentDate.getMonth();
        let currentViewYear = currentDate.getFullYear();
        let editingHabitId = null;
        let deferredPrompt = null;

        // DOM Elements
        const habitListEl = document.getElementById('habit-list');
        const habitForm = document.getElementById('habit-form');
        const habitModal = document.getElementById('habit-modal');
        const addHabitBtn = document.getElementById('add-habit-btn');
        const closeModalBtn = document.getElementById('close-modal');
        const cancelHabitBtn = document.getElementById('cancel-habit');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const calendarBody = document.getElementById('calendar-body');
        const monthYearEl = document.getElementById('month-year');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const statsContent = document.getElementById('stats-content');
        const installBtn = document.getElementById('install-btn');
        const colorPreview = document.getElementById('color-preview');
        const habitColorSelect = document.getElementById('habit-color');

        // Habit icons based on name
        const habitIcons = {
            'water': '💧',
            'workout': '🏋️',
            'read': '📚',
            'study': '📚',
            'meditate': '🧘',
            'sleep': '😴',
            'journal': '📝',
            'walk': '🚶',
            'yoga': '🧘‍♀️',
            'fruit': '🍎',
            'vegetable': '🥦',
            'code': '💻',
            'learn': '🧠',
            'guitar': '🎸',
            'piano': '🎹',
            'draw': '✏️',
            'paint': '🎨',
            'write': '✍️',
            'run': '🏃',
            'swim': '🏊',
            'cycle': '🚴',
            'default': '🌱'
        };

        // Initialize the app
        function init() {
            renderHabits();
            renderCalendar();
            renderStats();
            setupEventListeners();
            checkInstallPrompt();
            
            // Set default date to today
            document.getElementById('habit-start-date').valueAsDate = new Date();
            
            // Update color preview when color changes
            habitColorSelect.addEventListener('change', (e) => {
                colorPreview.style.backgroundColor = e.target.value;
            });
        }

        // Set up event listeners
        function setupEventListeners() {
            // Tab switching
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    switchTab(tabId);
                });
            });

            // Habit modal
            addHabitBtn.addEventListener('click', () => openHabitModal());
            closeModalBtn.addEventListener('click', () => closeHabitModal());
            cancelHabitBtn.addEventListener('click', () => closeHabitModal());
            habitForm.addEventListener('submit', handleHabitSubmit);

            // Calendar navigation
            prevMonthBtn.addEventListener('click', () => {
                currentViewMonth--;
                if (currentViewMonth < 0) {
                    currentViewMonth = 11;
                    currentViewYear--;
                }
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                currentViewMonth++;
                if (currentViewMonth > 11) {
                    currentViewMonth = 0;
                    currentViewYear++;
                }
                renderCalendar();
            });

            // Install button
            installBtn.addEventListener('click', installPWA);

            // Before install prompt
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.style.display = 'flex';
            });
        }

        // Check if we should show install prompt
        function checkInstallPrompt() {
            if (window.matchMedia('(display-mode: standalone)').matches) {
                installBtn.style.display = 'none';
            }
        }

        // Install PWA
        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                        createConfetti();
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                });
            }
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#3b82f6'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Switch between tabs
        function switchTab(tabId) {
            tabs.forEach(tab => {
                if (tab.getAttribute('data-tab') === tabId) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            tabContents.forEach(content => {
                if (content.id === tabId) {
                    content.classList.add('active');
                } else {
                    content.classList.remove('active');
                }
            });

            if (tabId === 'calendar') {
                renderCalendar();
            } else if (tabId === 'stats') {
                renderStats();
            }
        }

        // Get icon for habit based on name
        function getHabitIcon(name) {
            const lowerName = name.toLowerCase();
            for (const [key, icon] of Object.entries(habitIcons)) {
                if (lowerName.includes(key)) {
                    return icon;
                }
            }
            return habitIcons.default;
        }

        // Render all habits
        function renderHabits() {
            if (habits.length === 0) {
                habitListEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏠</div>
                        <div class="empty-state-text">Your habit nest is empty. Start building your daily routine!</div>
                        <button class="btn btn-primary" id="add-first-habit">Add Your First Habit</button>
                    </div>
                `;
                document.getElementById('add-first-habit').addEventListener('click', () => openHabitModal());
                return;
            }

            habitListEl.innerHTML = '';
            
            // Sort habits by streak length (descending)
            const sortedHabits = [...habits].sort((a, b) => {
                return calculateCurrentStreak(b) - calculateCurrentStreak(a);
            });
            
            sortedHabits.forEach((habit, index) => {
                const today = new Date().toISOString().split('T')[0];
                const todayLog = habit.logs.find(log => log.date === today) || { completed: 0 };
                const progress = (todayLog.completed / habit.target) * 100;
                const streak = calculateCurrentStreak(habit);
                const icon = getHabitIcon(habit.name);

                // Add animation delay based on index
                const delay = index * 0.1;
                
                const habitCard = document.createElement('div');
                habitCard.className = 'habit-card';
                habitCard.style.animationDelay = `${delay}s`;
                habitCard.innerHTML = `
                    <div class="habit-name">
                        <span class="habit-name-icon">${icon}</span>
                        ${habit.name}
                    </div>
                    <div class="habit-streak">
                        <span class="streak-count">
                            <span class="icon">🔥</span>
                            ${streak} day${streak !== 1 ? 's' : ''}
                        </span>
                        <span>current streak</span>
                    </div>
                    <div class="habit-progress">
                        <div class="progress-header">
                            <span>Today's progress</span>
                            <span>${todayLog.completed || 0}/${habit.target}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    <div class="habit-actions">
                        <button class="btn btn-success btn-complete" data-id="${habit.id}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            Complete
                        </button>
                        <div>
                            <button class="btn btn-edit btn-edit-habit" data-id="${habit.id}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>
                            <button class="btn btn-danger btn-delete-habit" data-id="${habit.id}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
                
                // Set the accent color
                habitCard.style.setProperty('--primary', habit.color);
                habitCard.style.setProperty('--primary-dark', shadeColor(habit.color, -20));
                
                habitListEl.appendChild(habitCard);
            });

            // Add event listeners to buttons
            document.querySelectorAll('.btn-complete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const habitId = e.target.closest('button').getAttribute('data-id');
                    logHabitCompletion(habitId);
                });
            });

            document.querySelectorAll('.btn-edit-habit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const habitId = e.target.closest('button').getAttribute('data-id');
                    editHabit(habitId);
                });
            });

            document.querySelectorAll('.btn-delete-habit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const habitId = e.target.closest('button').getAttribute('data-id');
                    deleteHabit(habitId);
                });
            });
        }

        // Helper function to shade colors
        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3), 16);
            let G = parseInt(color.substring(3,5), 16);
            let B = parseInt(color.substring(5,7), 16);

            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);

            R = (R<255)?R:255;  
            G = (G<255)?G:255;  
            B = (B<255)?B:255;  

            R = Math.round(R);
            G = Math.round(G);
            B = Math.round(B);

            const RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
            const GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
            const BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

            return "#"+RR+GG+BB;
        }

        // Log habit completion for today
        function logHabitCompletion(habitId) {
            const today = new Date().toISOString().split('T')[0];
            const habitIndex = habits.findIndex(h => h.id === habitId);
            
            if (habitIndex === -1) return;
            
            const habit = habits[habitIndex];
            const todayLogIndex = habit.logs.findIndex(log => log.date === today);
            
            if (todayLogIndex === -1) {
                // No log for today, add one
                habit.logs.push({ date: today, completed: 1 });
            } else {
                // Increment completed count, but don't exceed target
                const todayLog = habit.logs[todayLogIndex];
                if (todayLog.completed < habit.target) {
                    todayLog.completed++;
                } else {
                    // Already completed target for today
                    return;
                }
            }
            
            // Save and re-render
            saveHabits();
            renderHabits();
            
            // If on calendar view, update that too
            if (document.querySelector('.tab.active').getAttribute('data-tab') === 'calendar') {
                renderCalendar();
            }
            
            // If completed target, show celebration
            const todayLog = habit.logs.find(log => log.date === today);
            if (todayLog && todayLog.completed >= habit.target) {
                createConfetti();
            }
        }

        // Open habit modal for adding/editing
        function openHabitModal(habit = null) {
            document.getElementById('modal-title').textContent = habit ? 'Edit Habit' : 'Add New Habit';
            document.getElementById('habit-id').value = habit ? habit.id : '';
            document.getElementById('habit-name').value = habit ? habit.name : '';
            document.getElementById('habit-target').value = habit ? habit.target : 1;
            document.getElementById('habit-start-date').value = habit ? habit.startDate : new Date().toISOString().split('T')[0];
            const color = habit ? habit.color : '#6366f1';
            document.getElementById('habit-color').value = color;
            colorPreview.style.backgroundColor = color;
            
            habitModal.style.display = 'flex';
            document.getElementById('habit-name').focus();
        }

        // Close habit modal
        function closeHabitModal() {
            habitModal.style.display = 'none';
            habitForm.reset();
            editingHabitId = null;
        }

        // Handle habit form submission
        function handleHabitSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('habit-id').value || generateId();
            const name = document.getElementById('habit-name').value;
            const target = parseInt(document.getElementById('habit-target').value);
            const startDate = document.getElementById('habit-start-date').value;
            const color = document.getElementById('habit-color').value;
            
            const habitData = {
                id,
                name,
                target,
                startDate,
                color,
                logs: []
            };
            
            // Check if we're editing or adding
            const existingHabitIndex = habits.findIndex(h => h.id === id);
            
            if (existingHabitIndex !== -1) {
                // Editing - preserve logs
                habitData.logs = habits[existingHabitIndex].logs;
                habits[existingHabitIndex] = habitData;
            } else {
                // Adding new habit
                habits.push(habitData);
            }
            
            saveHabits();
            renderHabits();
            closeHabitModal();
        }

        // Edit a habit
        function editHabit(habitId) {
            const habit = habits.find(h => h.id === habitId);
            if (habit) {
                openHabitModal(habit);
            }
        }

        // Delete a habit
        function deleteHabit(habitId) {
            if (confirm('Are you sure you want to delete this habit? All progress will be lost.')) {
                habits = habits.filter(h => h.id !== habitId);
                saveHabits();
                renderHabits();
                
                // If on calendar view, update that too
                if (document.querySelector('.tab.active').getAttribute('data-tab') === 'calendar') {
                    renderCalendar();
                }
            }
        }

        // Save habits to localStorage
        function saveHabits() {
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        // Generate a unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Render the calendar view
        function renderCalendar() {
            const firstDay = new Date(currentViewYear, currentViewMonth, 1);
            const lastDay = new Date(currentViewYear, currentViewMonth + 1, 0);
            const daysInMonth = lastDay.getDate();
            
            // Set month/year display
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            monthYearEl.textContent = `${monthNames[currentViewMonth]} ${currentViewYear}`;
            
            // Clear previous calendar
            calendarBody.innerHTML = '';
            
            // Calculate starting day (0 = Sunday, 6 = Saturday)
            let startingDay = firstDay.getDay();
            
            // Create calendar rows
            let date = 1;
            for (let i = 0; i < 6; i++) {
                // Stop if we've gone past the last day of the month
                if (date > daysInMonth) break;
                
                const row = document.createElement('tr');
                
                // Create cells for each day of the week
                for (let j = 0; j < 7; j++) {
                    const cell = document.createElement('td');
                    
                    if (i === 0 && j < startingDay) {
                        // Days from previous month
                        const prevMonthLastDay = new Date(currentViewYear, currentViewMonth, 0).getDate();
                        const prevDate = prevMonthLastDay - (startingDay - j - 1);
                        cell.innerHTML = `<div class="calendar-day day-outside-month">${prevDate}</div>`;
                        cell.classList.add('day-outside-month');
                    } else if (date > daysInMonth) {
                        // Days from next month
                        const nextDate = date - daysInMonth;
                        cell.innerHTML = `<div class="calendar-day day-outside-month">${nextDate}</div>`;
                        cell.classList.add('day-outside-month');
                        date++;
                    } else {
                        // Current month days
                        const currentDateStr = `${currentViewYear}-${String(currentViewMonth + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                        
                        // Check if this is today
                        const today = new Date();
                        if (today.getFullYear() === currentViewYear && 
                            today.getMonth() === currentViewMonth && 
                            today.getDate() === date) {
                            cell.classList.add('today');
                        }
                        
                        cell.innerHTML = `<div class="calendar-day">${date}</div>`;
                        
                        // Add habit indicators
                        const indicatorsContainer = document.createElement('div');
                        indicatorsContainer.className = 'habit-indicators';
                        
                        habits.forEach(habit => {
                            const habitLog = habit.logs.find(log => log.date === currentDateStr);
                            if (habitLog) {
                                const indicator = document.createElement('div');
                                indicator.className = 'habit-indicator';
                                indicator.style.backgroundColor = habit.color;
                                
                                if (habitLog.completed >= habit.target) {
                                    indicator.classList.add('completed');
                                    indicator.setAttribute('data-tooltip', `${habit.name}: Completed`);
                                } else if (habitLog.completed > 0) {
                                    indicator.classList.add('partial');
                                    indicator.setAttribute('data-tooltip', `${habit.name}: Partial (${habitLog.completed}/${habit.target})`);
                                } else {
                                    indicator.classList.add('missed');
                                    indicator.setAttribute('data-tooltip', `${habit.name}: Missed`);
                                }
                                
                                // Check if this is part of a streak
                                if (isPartOfStreak(habit, currentDateStr)) {
                                    indicator.classList.add('streak-day');
                                }
                                
                                indicatorsContainer.appendChild(indicator);
                            }
                        });
                        
                        cell.appendChild(indicatorsContainer);
                        date++;
                    }
                    
                    row.appendChild(cell);
                }
                
                calendarBody.appendChild(row);
            }
        }

        // Render stats view
        function renderStats() {
            if (habits.length === 0) {
                statsContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">No habits to show stats for yet. Start tracking to see your progress!</div>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="stats-grid">';
            
            // Overall completion rate
            const totalPossible = habits.reduce((sum, habit) => sum + habit.logs.length * habit.target, 0);
            const totalCompleted = habits.reduce((sum, habit) => {
                return sum + habit.logs.reduce((logSum, log) => logSum + log.completed, 0);
            }, 0);
            const completionRate = totalPossible > 0 ? Math.round((totalCompleted / totalPossible) * 100) : 0;
            
            // Calculate completion rate for last 7 days
            const last7Days = new Date();
            last7Days.setDate(last7Days.getDate() - 7);
            const last7DaysStr = last7Days.toISOString().split('T')[0];
            
            const recentHabits = habits.filter(habit => {
                return habit.logs.some(log => log.date >= last7DaysStr);
            });
            
            const recentCompletionRate = recentHabits.length > 0 ? 
                Math.round(recentHabits.reduce((sum, habit) => {
                    const recentLogs = habit.logs.filter(log => log.date >= last7DaysStr);
                    const possible = recentLogs.length * habit.target;
                    const completed = recentLogs.reduce((sum, log) => sum + log.completed, 0);
                    return sum + (possible > 0 ? (completed / possible) * 100 : 0);
                }, 0) / recentHabits.length) : 0;
            
            // Longest streak
            let longestStreak = 0;
            habits.forEach(habit => {
                const streak = calculateLongestStreak(habit);
                if (streak > longestStreak) {
                    longestStreak = streak;
                }
            });
            
            // Most consistent habit (highest completion rate)
            let mostConsistentHabit = null;
            let highestCompletionRate = 0;
            
            habits.forEach(habit => {
                const rate = calculateHabitCompletionRate(habit);
                if (rate > highestCompletionRate) {
                    highestCompletionRate = rate;
                    mostConsistentHabit = habit;
                }
            });
            
            html += `
                <div class="stat-card">
                    <h3>Overall Completion</h3>
                    <div class="stat-value">${completionRate}%</div>
                    <div class="stat-detail">${totalCompleted} of ${totalPossible} targets met across all habits</div>
                </div>
                
                <div class="stat-card">
                    <h3>Recent Progress</h3>
                    <div class="stat-value">${recentCompletionRate}%</div>
                    <div class="stat-detail">Completion rate for the last 7 days</div>
                </div>
                
                <div class="stat-card">
                    <h3>Longest Streak</h3>
                    <div class="stat-value">${longestStreak}</div>
                    <div class="stat-detail">Your best streak across all habits</div>
                </div>
            `;
            
            if (mostConsistentHabit) {
                html += `
                    <div class="stat-card">
                        <h3>Most Consistent</h3>
                        <div class="stat-value" style="color: ${mostConsistentHabit.color}">${mostConsistentHabit.name}</div>
                        <div class="stat-detail">${highestCompletionRate}% completion rate</div>
                    </div>
                `;
            }
            
            // Habit-specific stats
            habits.forEach(habit => {
                const currentStreak = calculateCurrentStreak(habit);
                const longestStreak = calculateLongestStreak(habit);
                const completionRate = calculateHabitCompletionRate(habit);
                
                html += `
                    <div class="stat-card" style="border-left: 4px solid ${habit.color}">
                        <h3>${habit.name}</h3>
                        <div class="stat-row">
                            <span class="stat-row-label">Current Streak:</span>
                            <span class="stat-row-value">${currentStreak} day${currentStreak !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-row-label">Longest Streak:</span>
                            <span class="stat-row-value">${longestStreak} day${longestStreak !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-row-label">Completion Rate:</span>
                            <span class="stat-row-value">${completionRate}%</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-row-label">Total Completed:</span>
                            <span class="stat-row-value">${habit.logs.reduce((sum, log) => sum + log.completed, 0)}</span>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            statsContent.innerHTML = html;
        }

        // Calculate current streak for a habit
        function calculateCurrentStreak(habit) {
            if (habit.logs.length === 0) return 0;
            
            // Sort logs by date (newest first)
            const sortedLogs = [...habit.logs].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            let streak = 0;
            let currentDate = new Date();
            
            // Adjust to start from yesterday if today isn't completed yet
            const todayStr = currentDate.toISOString().split('T')[0];
            const todayLog = sortedLogs.find(log => log.date === todayStr);
            
            if (!todayLog || todayLog.completed < habit.target) {
                currentDate.setDate(currentDate.getDate() - 1);
            }
            
            // Check consecutive days
            while (true) {
                const dateStr = currentDate.toISOString().split('T')[0];
                const log = sortedLogs.find(l => l.date === dateStr);
                
                if (log && log.completed >= habit.target) {
                    streak++;
                    currentDate.setDate(currentDate.getDate() - 1);
                } else {
                    break;
                }
            }
            
            return streak;
        }

        // Calculate longest streak for a habit
        function calculateLongestStreak(habit) {
            if (habit.logs.length === 0) return 0;
            
            // Sort logs by date (oldest first)
            const sortedLogs = [...habit.logs].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            let longestStreak = 0;
            let currentStreak = 0;
            let prevDate = null;
            
            sortedLogs.forEach(log => {
                if (log.completed >= habit.target) {
                    const logDate = new Date(log.date);
                    
                    if (prevDate === null) {
                        // First log
                        currentStreak = 1;
                    } else {
                        // Check if consecutive
                        const expectedDate = new Date(prevDate);
                        expectedDate.setDate(expectedDate.getDate() + 1);
                        
                        if (logDate.toISOString().split('T')[0] === expectedDate.toISOString().split('T')[0]) {
                            currentStreak++;
                        } else {
                            // Not consecutive, reset streak
                            currentStreak = 1;
                        }
                    }
                    
                    if (currentStreak > longestStreak) {
                        longestStreak = currentStreak;
                    }
                    
                    prevDate = log.date;
                } else {
                    // Missed day, reset streak
                    currentStreak = 0;
                    prevDate = null;
                }
            });
            
            return longestStreak;
        }

        // Calculate completion rate for a habit
        function calculateHabitCompletionRate(habit) {
            if (habit.logs.length === 0) return 0;
            
            const totalPossible = habit.logs.length * habit.target;
            const totalCompleted = habit.logs.reduce((sum, log) => sum + log.completed, 0);
            
            return Math.round((totalCompleted / totalPossible) * 100);
        }

        // Check if a date is part of a streak for a habit
        function isPartOfStreak(habit, dateStr) {
            const date = new Date(dateStr);
            const prevDay = new Date(date);
            prevDay.setDate(prevDay.getDate() - 1);
            const prevDayStr = prevDay.toISOString().split('T')[0];
            
            const nextDay = new Date(date);
            nextDay.setDate(nextDay.getDate() + 1);
            const nextDayStr = nextDay.toISOString().split('T')[0];
            
            // Check previous day
            const prevLog = habit.logs.find(log => log.date === prevDayStr);
            const hasPrev = prevLog && prevLog.completed >= habit.target;
            
            // Check next day
            const nextLog = habit.logs.find(log => log.date === nextDayStr);
            const hasNext = nextLog && nextLog.completed >= habit.target;
            
            // Current day
            const currentLog = habit.logs.find(log => log.date === dateStr);
            const hasCurrent = currentLog && currentLog.completed >= habit.target;
            
            return hasCurrent && (hasPrev || hasNext);
        }

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('ServiceWorker registration successful');
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
